# Builds GrainTimeAgent.exe (the agent for AgVantagePC scale PCs) on Windows,
# after testing the Windows-only parts (DPAPI, time zones, sign-in start-up).
# Every run keeps the .exe as an artifact (90 days). When VERSION in
# agent/graintime_agent/__init__.py has no GitHub Release yet, the build also
# publishes one (tag agent-v<version>), a permanent download page. A version
# already released is never replaced by a branch build; pushing the tag
# agent-v<version> again re-publishes that version's .exe.
name: GrainTime Agent (Windows build)
on:
  push:
    # Both must be listed: with tags alone, GitHub ignores branch pushes.
    branches: ["**"]
    tags: ["agent-v*"]
    paths:
      - "agent/**"
      - "backend/graintime/common/profiles.py"
      - "backend/graintime/common/normalize.py"
      - "backend/graintime/collector/mapping.py"
      - ".github/workflows/agent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}\backend;${{ github.workspace }}\agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r agent/requirements.txt pyinstaller==6.22.3 pytest==9.1.1
      - name: Windows checks
        run: python -m pytest agent/tests -q
      - name: Build GrainTimeAgent.exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --name GrainTimeAgent
          --paths backend --paths agent --collect-data tzdata
          --hidden-import graintime_agent.ui
          agent/run_agent.py
      - name: Self-test the built .exe
        shell: pwsh
        run: |
          $env:GRAINTIME_AGENT_HOME = "$env:RUNNER_TEMP\gta"
          $p = Start-Process dist\GrainTimeAgent.exe -ArgumentList "selftest" -Wait -PassThru
          Get-Content "$env:GRAINTIME_AGENT_HOME\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GrainTimeAgent
          path: dist/GrainTimeAgent.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Decide whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' agent/graintime_agent/__init__.py)
          tag="agent-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${version} in agent/graintime_agent/__init__.py"
              exit 1
            fi
            echo "mode=replace" >> "$GITHUB_OUTPUT"
          elif gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::${tag} is already released; bump VERSION to publish a new one."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.mode != 'skip'
        with:
          name: GrainTimeAgent
          path: dist
      - name: Publish the release
        if: steps.plan.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          sha256sum dist/GrainTimeAgent.exe | sed 's#dist/##' | tee dist/GrainTimeAgent.exe.sha256
          notes="GrainTime Agent ${TAG#agent-v} for AgVantagePC scale PCs (Windows).

          Download **GrainTimeAgent.exe**, copy it to the scale PC and run it while signed in as the
          account that runs AgVantagePC. Pair it with the code from the site's page in GrainTime
          (Configuration > Sites > the site > GrainTime Agent). No administrator rights needed.
          Install guide and safety rules: agent/README.md.

          Built and self-tested on Windows by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          from commit ${GITHUB_SHA}.
          Not code-signed: Windows SmartScreen may ask for confirmation the first time.
          SHA-256: $(cut -d' ' -f1 dist/GrainTimeAgent.exe.sha256)"
          if [ "${MODE}" = "replace" ] && gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/GrainTimeAgent.exe dist/GrainTimeAgent.exe.sha256 --clobber
          else
            gh release create "${TAG}" dist/GrainTimeAgent.exe dist/GrainTimeAgent.exe.sha256 \
              --target "${GITHUB_SHA}" --title "GrainTime Agent ${TAG#agent-v}" --notes "$notes"
          fi
