# Builds GrainTimeAgent.exe (the agent for AgVantagePC scale PCs) on Windows,
# after testing the Windows-only parts (DPAPI, time zones, sign-in start-up).
# Every run keeps the .exe as an artifact (90 days). Pushing a tag
# agent-v<version> (matching VERSION in agent/graintime_agent/__init__.py)
# also publishes it as a GitHub Release, a permanent download page.
name: GrainTime Agent (Windows build)
on:
  push:
    tags: ["agent-v*"]
    paths:
      - "agent/**"
      - "backend/graintime/common/profiles.py"
      - "backend/graintime/common/normalize.py"
      - "backend/graintime/collector/mapping.py"
      - ".github/workflows/agent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}\backend;${{ github.workspace }}\agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r agent/requirements.txt pyinstaller==6.22.3 pytest==9.1.1
      - name: Windows checks
        run: python -m pytest agent/tests -q
      - name: Build GrainTimeAgent.exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --name GrainTimeAgent
          --paths backend --paths agent --collect-data tzdata
          --hidden-import graintime_agent.ui
          agent/run_agent.py
      - name: Self-test the built .exe
        shell: pwsh
        run: |
          $env:GRAINTIME_AGENT_HOME = "$env:RUNNER_TEMP\gta"
          $p = Start-Process dist\GrainTimeAgent.exe -ArgumentList "selftest" -Wait -PassThru
          Get-Content "$env:GRAINTIME_AGENT_HOME\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GrainTimeAgent
          path: dist/GrainTimeAgent.exe
          if-no-files-found: error

  publish:
    # Only for agent-v* tags: attach the tested .exe to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: GrainTimeAgent
          path: dist
      - name: Check the tag matches the agent's version
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' agent/graintime_agent/__init__.py)
          if [ "${GITHUB_REF_NAME}" != "agent-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${version} in agent/graintime_agent/__init__.py"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/GrainTimeAgent.exe | tee dist/GrainTimeAgent.exe.sha256
          notes="GrainTime Agent ${GITHUB_REF_NAME#agent-v} for AgVantagePC scale PCs (Windows).

          Download **GrainTimeAgent.exe**, copy it to the scale PC and run it while signed in as the
          account that runs AgVantagePC. Pair it with the code from the site's page in GrainTime
          (Configuration > Sites > the site > GrainTime Agent). No administrator rights needed.
          Install guide and safety rules: agent/README.md.

          Built and self-tested on Windows by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          Not code-signed: Windows SmartScreen may ask for confirmation the first time.
          SHA-256: $(cut -d' ' -f1 dist/GrainTimeAgent.exe.sha256)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/GrainTimeAgent.exe dist/GrainTimeAgent.exe.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/GrainTimeAgent.exe dist/GrainTimeAgent.exe.sha256 \
              --title "GrainTime Agent ${GITHUB_REF_NAME#agent-v}" --notes "$notes" --verify-tag
          fi
